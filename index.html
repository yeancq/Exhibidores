Cargando… si esto no cambia en unos segundos, tu conexión está bloqueando los scripts externos (React/Babel). Prueba con otra red o navegador.

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

const DIAS = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
const uid = () => Math.random().toString(36).slice(2, 10);

const NOMBRES_PARTICIPANTES = [
  "Linny de Abello", "Valentina Grisales", "Luis Henao Agudelo", "Daniel Hoyos",
  "Federico Hoyos", "Vanessa de Hoyos", "Alex Ledezma", "Osdalis Ledezma",
  "Rocío de Lobato", "Saulo Lobato", "Angel Lozano", "Rut de Lozano",
  "Conchi Mariñas", "Mari Jose Martín", "Alanna Mendes", "Carmen Moreno de Ancín",
  "Isabel Nieva", "Anahí Panero", "Ana Mari Pedraza", "Rebeca Pérez de (Yagüe)",
  "Miguel Pérez Suero", "Daniel Pérez Yagüe", "Yean Carlos Quintero",
  "Maryuri Jaramillo de Quintero", "Montse de Racero", "Roberto Sanz",
  "Violeta de Sanz", "Maylín Azuaje de Sousa", "Jimena Trujillo", "Sarai Vázquez",
];
const participantesIniciales = () => NOMBRES_PARTICIPANTES.map((nombre) => ({
  id: uid(), nombre, disponibilidad: {}, prefPartnerId: null, prefTipo: "blanda", preferenciasPorTurno: {}, ausencias: [],
}));

const PLANTILLAS_INICIALES = [
  { id: uid(), dia: "Mar", sitio: "Ramón y Cajal", inicio: "11:00", fin: "13:00" },
  { id: uid(), dia: "Mar", sitio: "La Estación", inicio: "11:00", fin: "13:00" },
  { id: uid(), dia: "Mié", sitio: "Ramón y Cajal", inicio: "17:30", fin: "19:30" },
  { id: uid(), dia: "Mié", sitio: "La Estación", inicio: "17:30", fin: "19:30" },
  { id: uid(), dia: "Jue", sitio: "Ramón y Cajal", inicio: "11:00", fin: "13:00" },
  { id: uid(), dia: "Jue", sitio: "La Estación", inicio: "11:00", fin: "13:00" },
  { id: uid(), dia: "Vie", sitio: "Ramón y Cajal", inicio: "11:00", fin: "13:00" },
  { id: uid(), dia: "Vie", sitio: "La Estación", inicio: "11:00", fin: "13:00" },
  { id: uid(), dia: "Vie", sitio: "Ramón y Cajal", inicio: "17:30", fin: "19:30" },
  { id: uid(), dia: "Vie", sitio: "La Estación", inicio: "17:30", fin: "19:30" },
  { id: uid(), dia: "Sáb", sitio: "Ramón y Cajal", inicio: "11:00", fin: "13:00" },
  { id: uid(), dia: "Sáb", sitio: "Mercadillo", inicio: "11:00", fin: "13:00" },
];

const STORAGE_KEY = "asignador-turnos-exhibidores-v1";
function cargarGuardado() {
  try {
    if (typeof localStorage === "undefined") return null;
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}
const GUARDADO = cargarGuardado();

const MESES_LARGO = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
function formatMesLargo(mesStr) {
  if (!mesStr) return "";
  const [y, m] = mesStr.split("-");
  return `${MESES_LARGO[parseInt(m, 10) - 1]} ${y}`;
}

const tokens = {
  bg: "#12151b",
  surface: "#181d25",
  surfaceAlt: "#1f2631",
  border: "#2a3140",
  text: "#eef1f5",
  muted: "#8a93a3",
  accent: "#e2a63f",
  accent2: "#49b3a6",
  warn: "#d9614f",
};

// --- Iconos SVG en línea (reemplazan a lucide-react para no depender de un bundler) ---
const Icon = ({ children, size = 14, color = "currentColor" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
    strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
);
const Plus = (p) => <Icon {...p}><path d="M12 5v14M5 12h14"/></Icon>;
const Trash2 = (p) => <Icon {...p}><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/></Icon>;
const Users = (p) => <Icon {...p}><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2M17 11a4 4 0 0 0 0-8M23 21v-2a4 4 0 0 0-3-3.87"/></Icon>;
const CalendarClock = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><circle cx="16" cy="16" r="3"/><path d="M16 14.8V16l1 .8"/></Icon>;
const Shuffle = (p) => <Icon {...p}><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></Icon>;
const Link2 = (p) => <Icon {...p}><path d="M9 17H7A5 5 0 0 1 7 7h2M15 7h2a5 5 0 1 1 0 10h-2M8 12h8"/></Icon>;
const AlertTriangle = (p) => <Icon {...p}><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4M12 17h.01"/></Icon>;
const ChevronRight = (p) => <Icon {...p}><path d="m9 18 6-6-6-6"/></Icon>;
const Copy = (p) => <Icon {...p}><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></Icon>;
const CalendarX = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9.5 15.5l5 5M14.5 15.5l-5 5"/></Icon>;

function timeKey(t) { return `${t.fecha}|${t.inicio}|${t.fin}`; }

// ¿Está esta persona de ausencia en una fecha concreta (según los periodos "desde/hasta")?
function estaAusenteEnFecha(p, fecha) {
  if (!p.ausencias || p.ausencias.length === 0 || !fecha) return false;
  return p.ausencias.some((a) => a.desde && a.hasta && a.desde <= fecha && a.hasta >= fecha);
}
function estaAusenteHoy(p) {
  return estaAusenteEnFecha(p, new Date().toISOString().slice(0, 10));
}

// Genera los turnos reales (con fecha) de un mes "YYYY-MM" a partir de las plantillas recurrentes.
function generarTurnosMes(plantillas, mesStr) {
  if (!mesStr) return [];
  const [yearStr, monthStr] = mesStr.split("-");
  const year = parseInt(yearStr, 10);
  const month = parseInt(monthStr, 10) - 1;
  if (Number.isNaN(year) || Number.isNaN(month)) return [];
  const diasEnMes = new Date(year, month + 1, 0).getDate();
  const generados = [];
  for (let dia = 1; dia <= diasEnMes; dia++) {
    const fechaObj = new Date(year, month, dia);
    const diaAbrev = DIAS[(fechaObj.getDay() + 6) % 7]; // JS: Dom=0 -> alinear con DIAS (Lun..Dom)
    const fecha = `${year}-${String(month + 1).padStart(2, "0")}-${String(dia).padStart(2, "0")}`;
    plantillas.filter((pl) => pl.dia === diaAbrev).forEach((pl) => {
      generados.push({ id: uid(), plantillaId: pl.id, fecha, dia: diaAbrev, sitio: pl.sitio, inicio: pl.inicio, fin: pl.fin });
    });
  }
  generados.sort((a, b) => a.fecha === b.fecha ? a.inicio.localeCompare(b.inicio) : a.fecha.localeCompare(b.fecha));
  return generados;
}

// Preferencia efectiva de una persona para un turno concreto:
// prioriza la preferencia específica de ese turno; si no hay, usa la preferencia general.
function obtenerPreferencia(p, plantillaId) {
  const especifica = p.preferenciasPorTurno && p.preferenciasPorTurno[plantillaId];
  if (especifica && especifica.partnerId) return especifica;
  if (p.prefPartnerId) return { partnerId: p.prefPartnerId, tipo: p.prefTipo || "blanda" };
  return null;
}

function assignTurnos(participantes, turnosDelMes) {
  const disponibles = (t) => participantes.filter((p) => p.disponibilidad[t.plantillaId] && !estaAusenteEnFecha(p, t.fecha));
  const orden = [...turnosDelMes].sort((a, b) => disponibles(a).length - disponibles(b).length);
  const asignadosCount = {};
  participantes.forEach((p) => (asignadosCount[p.id] = 0));
  const timeUsado = {};
  participantes.forEach((p) => (timeUsado[p.id] = new Set()));
  const resultados = {};

  for (const t of orden) {
    const tk = timeKey(t);
    let pool = disponibles(t).filter((p) => !timeUsado[p.id].has(tk));

    if (pool.length < 2) {
      resultados[t.id] = {
        pair: null,
        reason: pool.length === 0 ? "Nadie disponible para este turno." : "Solo hay una persona disponible; falta pareja.",
      };
      continue;
    }

    const poolIds = new Set(pool.map((p) => p.id));
    pool = pool.filter((p) => {
      const pref = obtenerPreferencia(p, t.plantillaId);
      if (pref && pref.tipo === "dura") return poolIds.has(pref.partnerId);
      return true;
    });

    if (pool.length < 2) {
      const bloqueado = disponibles(t).find((p) => {
        const pref = obtenerPreferencia(p, t.plantillaId);
        return pref && pref.tipo === "dura" && !poolIds.has(pref.partnerId);
      });
      resultados[t.id] = {
        pair: null,
        reason: bloqueado
          ? `${bloqueado.nombre} exige trabajar con su pareja fija, pero no coincide en este turno.`
          : "No hay suficientes personas compatibles.",
      };
      continue;
    }

    let mejor = null;
    let mejorScore = -Infinity;
    for (let i = 0; i < pool.length; i++) {
      for (let j = i + 1; j < pool.length; j++) {
        const a = pool[i], b = pool[j];
        const prefA = obtenerPreferencia(a, t.plantillaId);
        const prefB = obtenerPreferencia(b, t.plantillaId);
        if (prefA && prefA.tipo === "dura" && prefA.partnerId !== b.id) continue;
        if (prefB && prefB.tipo === "dura" && prefB.partnerId !== a.id) continue;
        let score = 0;
        const aQuiereB = prefA && prefA.partnerId === b.id;
        const bQuiereA = prefB && prefB.partnerId === a.id;
        if (aQuiereB && bQuiereA) score += 5;
        else if (aQuiereB || bQuiereA) score += 3;
        const carga = asignadosCount[a.id] + asignadosCount[b.id];
        score -= carga * 0.5;
        if (score > mejorScore) { mejorScore = score; mejor = [a, b]; }
      }
    }

    if (!mejor) {
      resultados[t.id] = { pair: null, reason: "No se encontró una pareja compatible." };
      continue;
    }

    resultados[t.id] = { pair: [mejor[0].id, mejor[1].id], reason: null };
    asignadosCount[mejor[0].id]++;
    asignadosCount[mejor[1].id]++;
    timeUsado[mejor[0].id].add(tk);
    timeUsado[mejor[1].id].add(tk);
  }

  return { resultados, asignadosCount };
}

function AsignadorTurnos() {
  const [tab, setTab] = useState("plantillas");
  const [plantillas, setPlantillas] = useState(() => GUARDADO?.plantillas || PLANTILLAS_INICIALES);
  const [participantes, setParticipantes] = useState(() => GUARDADO?.participantes || participantesIniciales());
  const [nombreNuevo, setNombreNuevo] = useState("");
  const [mes, setMesState] = useState(() => GUARDADO?.ultimoMes || new Date().toISOString().slice(0, 7));
  const [historial, setHistorial] = useState(() => GUARDADO?.historial || {});
  const guardadoDelMes = historial[mes];
  const [turnosDelMes, setTurnosDelMes] = useState(() => guardadoDelMes?.turnosDelMes || []);
  const [asignacion, setAsignacion] = useState(() => guardadoDelMes?.asignacion || null);

  // Guarda automáticamente en este navegador cada vez que algo cambia.
  useEffect(() => {
    try {
      if (typeof localStorage === "undefined") return;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ plantillas, participantes, historial, ultimoMes: mes }));
    } catch (e) { /* almacenamiento no disponible */ }
  }, [plantillas, participantes, historial, mes]);

  // Al cambiar de mes, recupera lo que ya estaba grabado para ese mes (si existe).
  const cambiarMes = (nuevoMes) => {
    setMesState(nuevoMes);
    const g = historial[nuevoMes];
    setTurnosDelMes(g?.turnosDelMes || []);
    setAsignacion(g?.asignacion || null);
  };

  const addTurno = () => setPlantillas((t) => [...t, { id: uid(), dia: "Lun", sitio: "", inicio: "08:00", fin: "16:00" }]);
  const duplicarTurno = (id) => setPlantillas((t) => {
    const orig = t.find((x) => x.id === id);
    if (!orig) return t;
    return [...t, { ...orig, id: uid() }];
  });
  const updateTurno = (id, field, value) => setPlantillas((t) => t.map((x) => (x.id === id ? { ...x, [field]: value } : x)));
  const removeTurno = (id) => {
    setPlantillas((t) => t.filter((x) => x.id !== id));
    setParticipantes((ps) => ps.map((p) => {
      const disp = { ...p.disponibilidad };
      delete disp[id];
      return { ...p, disponibilidad: disp };
    }));
    setTurnosDelMes((tm) => tm.filter((t) => t.plantillaId !== id));
    setAsignacion(null);
    setHistorial((h) => {
      if (!h[mes]) return h;
      return { ...h, [mes]: { turnosDelMes: h[mes].turnosDelMes.filter((t) => t.plantillaId !== id), asignacion: null } };
    });
  };

  const generarMes = () => {
    const nuevos = generarTurnosMes(plantillas, mes);
    setTurnosDelMes(nuevos);
    setAsignacion(null);
    setHistorial((h) => ({ ...h, [mes]: { turnosDelMes: nuevos, asignacion: null } }));
  };

  const addParticipante = () => {
    const nombre = nombreNuevo.trim();
    if (!nombre) return;
    setParticipantes((ps) => [...ps, { id: uid(), nombre, disponibilidad: {}, prefPartnerId: null, prefTipo: "blanda", preferenciasPorTurno: {}, ausencias: [] }]);
    setNombreNuevo("");
    setAsignacion(null);
  };
  const removeParticipante = (id) => {
    setParticipantes((ps) => ps.filter((p) => p.id !== id).map((p) => {
      const limpio = p.prefPartnerId === id ? { ...p, prefPartnerId: null } : p;
      const preferenciasPorTurno = { ...(limpio.preferenciasPorTurno || {}) };
      let cambio = false;
      Object.keys(preferenciasPorTurno).forEach((tid) => {
        if (preferenciasPorTurno[tid]?.partnerId === id) { delete preferenciasPorTurno[tid]; cambio = true; }
      });
      return cambio ? { ...limpio, preferenciasPorTurno } : limpio;
    }));
    setAsignacion(null);
  };
  const toggleDisponibilidad = (participanteId, turnoId) => {
    setParticipantes((ps) => ps.map((p) => (p.id === participanteId
      ? { ...p, disponibilidad: { ...p.disponibilidad, [turnoId]: !p.disponibilidad[turnoId] } }
      : p)));
    setAsignacion(null);
  };
  const updateParticipante = (id, field, value) => {
    setParticipantes((ps) => ps.map((p) => (p.id === id ? { ...p, [field]: value } : p)));
    setAsignacion(null);
  };
  const setPreferenciaTurno = (participanteId, turnoId, partnerId, tipo) => {
    setParticipantes((ps) => ps.map((p) => {
      if (p.id !== participanteId) return p;
      const preferenciasPorTurno = { ...(p.preferenciasPorTurno || {}) };
      if (!partnerId) delete preferenciasPorTurno[turnoId];
      else preferenciasPorTurno[turnoId] = { partnerId, tipo: tipo || "blanda" };
      return { ...p, preferenciasPorTurno };
    }));
    setAsignacion(null);
  };

  const addAusencia = (id) => {
    setParticipantes((ps) => ps.map((p) => (p.id === id ? { ...p, ausencias: [...(p.ausencias || []), { desde: "", hasta: "" }] } : p)));
    setAsignacion(null);
  };
  const updateAusencia = (id, idx, field, value) => {
    setParticipantes((ps) => ps.map((p) => {
      if (p.id !== id) return p;
      const ausencias = p.ausencias.map((a, i) => (i === idx ? { ...a, [field]: value } : a));
      return { ...p, ausencias };
    }));
    setAsignacion(null);
  };
  const removeAusencia = (id, idx) => {
    setParticipantes((ps) => ps.map((p) => {
      if (p.id !== id) return p;
      return { ...p, ausencias: p.ausencias.filter((_, i) => i !== idx) };
    }));
    setAsignacion(null);
  };

  const generar = () => {
    const { resultados, asignadosCount } = assignTurnos(participantes, turnosDelMes);
    const nuevaAsignacion = { resultados, asignadosCount };
    setAsignacion(nuevaAsignacion);
    setHistorial((h) => ({ ...h, [mes]: { turnosDelMes, asignacion: nuevaAsignacion } }));
  };

  const porDia = useMemo(() => {
    const map = {};
    DIAS.forEach((d) => (map[d] = []));
    plantillas.forEach((t) => { if (!map[t.dia]) map[t.dia] = []; map[t.dia].push(t); });
    return map;
  }, [plantillas]);

  const nombreDe = (id) => participantes.find((p) => p.id === id)?.nombre || "?";
  const cubiertos = asignacion ? Object.values(asignacion.resultados).filter((r) => r.pair).length : 0;

  const reiniciarTodo = () => {
    if (!confirm("Esto borra todos los datos guardados en este navegador (plantillas, participantes e historial de asignaciones). ¿Continuar?")) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    setPlantillas(PLANTILLAS_INICIALES);
    setParticipantes(participantesIniciales());
    setHistorial({});
    setTurnosDelMes([]);
    setAsignacion(null);
  };

  return (
    <div style={{
      background: tokens.bg, color: tokens.text,
      fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif",
      minHeight: "100%", borderRadius: "12px", overflow: "hidden", border: `1px solid ${tokens.border}`,
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
        .at-mono { font-family: 'IBM Plex Mono', monospace; }
        .at-display { font-family: 'Space Grotesk', sans-serif; }
        .at-tab { transition: all 0.15s ease; }
        .at-tab:hover { color: ${tokens.text} !important; }
        .at-chip { transition: all 0.12s ease; cursor: pointer; user-select: none; }
        .at-chip:hover { border-color: ${tokens.accent} !important; }
        .at-btn { transition: all 0.15s ease; cursor: pointer; }
        .at-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .at-row:hover { background: ${tokens.surfaceAlt} !important; }
        .at-input, .at-select {
          background: ${tokens.surfaceAlt}; border: 1px solid ${tokens.border}; color: ${tokens.text};
          border-radius: 6px; padding: 7px 10px; font-size: 13px; font-family: inherit;
        }
        .at-input:focus, .at-select:focus { outline: 1px solid ${tokens.accent}; }
        ::placeholder { color: ${tokens.muted}; }
      `}</style>

      <div style={{ padding: "20px 24px 16px", borderBottom: `1px solid ${tokens.border}`, background: tokens.surface, display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: "12px" }}>
        <div>
          <div className="at-display" style={{ fontSize: "20px", fontWeight: 700, letterSpacing: "-0.01em" }}>Asignador de turnos</div>
          <div style={{ fontSize: "12.5px", color: tokens.muted, marginTop: "2px" }}>Turnos en pareja · disponibilidad y preferencias</div>
        </div>
        <button className="at-btn" onClick={reiniciarTodo} title="Borrar todos los datos guardados en este navegador" style={{
          background: "transparent", border: `1px solid ${tokens.border}`, borderRadius: "6px",
          padding: "6px 10px", color: tokens.muted, fontSize: "11px", fontWeight: 600, whiteSpace: "nowrap",
        }}>
          Reiniciar datos
        </button>
      </div>

      <div style={{ display: "flex", gap: "2px", padding: "10px 24px 0", background: tokens.surface, borderBottom: `1px solid ${tokens.border}` }}>
        {[
          { id: "plantillas", label: "Plantillas", icon: CalendarClock },
          { id: "participantes", label: "Participantes", icon: Users },
          { id: "asignacion", label: "Asignación", icon: Shuffle },
          { id: "calendario", label: "Calendario", icon: CalendarX },
        ].map((t) => {
          const IconC = t.icon;
          const active = tab === t.id;
          return (
            <button key={t.id} className="at-tab" onClick={() => setTab(t.id)} style={{
              display: "flex", alignItems: "center", gap: "6px", padding: "10px 16px", background: "transparent",
              border: "none", borderBottom: active ? `2px solid ${tokens.accent}` : "2px solid transparent",
              color: active ? tokens.accent : tokens.muted, fontSize: "13px", fontWeight: 600, cursor: "pointer",
            }}>
              <IconC size={14} />{t.label}
              {t.id === "plantillas" && <span className="at-mono" style={{ fontSize: "10.5px", color: tokens.muted }}>{plantillas.length}</span>}
              {t.id === "participantes" && <span className="at-mono" style={{ fontSize: "10.5px", color: tokens.muted }}>{participantes.length}</span>}
            </button>
          );
        })}
      </div>

      <div style={{ padding: "22px 24px 28px" }}>
        {tab === "plantillas" && (

function formatFechaLarga(fecha, dia) {
  if (!fecha) return "";
  const [y, m, d] = fecha.split("-");
  return `${dia} ${d}/${m}/${y}`;
}

function construirCeldas(mesStr) {
  if (!mesStr) return [];
  const [yearStr, monthStr] = mesStr.split("-");
  const year = parseInt(yearStr, 10);
  const month = parseInt(monthStr, 10) - 1;
  if (Number.isNaN(year) || Number.isNaN(month)) return [];
  const diasEnMes = new Date(year, month + 1, 0).getDate();
  const primerDiaSemana = (new Date(year, month, 1).getDay() + 6) % 7; // 0 = Lunes
  const celdas = [];
  for (let i = 0; i < primerDiaSemana; i++) celdas.push(null);
  for (let d = 1; d <= diasEnMes; d++) {
    const fecha = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    celdas.push({ fecha, dia: d });
  }
  while (celdas.length % 7 !== 0) celdas.push(null);
  return celdas;
}

function CalendarioTab({ mes, setMes, turnosDelMes, asignacion, nombreDe, historial }) {
  const turnosPorFecha = useMemo(() => {
    const map = {};
    turnosDelMes.forEach((t) => {
      if (!map[t.fecha]) map[t.fecha] = [];
      map[t.fecha].push(t);
    });
    Object.values(map).forEach((arr) => arr.sort((a, b) => a.inicio.localeCompare(b.inicio)));
    return map;
  }, [turnosDelMes]);

  const celdas = useMemo(() => construirCeldas(mes), [mes]);
  const hoy = new Date().toISOString().slice(0, 10);
  const mesesConDatos = Object.keys(historial).filter((m) => historial[m]?.turnosDelMes?.length).sort();

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "16px", flexWrap: "wrap", gap: "10px" }}>
        <div>
          <div className="at-display" style={{ fontSize: "16px", fontWeight: 700, textTransform: "capitalize" }}>{formatMesLargo(mes)}</div>
          <div style={{ fontSize: "11.5px", color: tokens.muted, marginTop: "2px" }}>
            {asignacion ? "Asignación grabada para este mes" : turnosDelMes.length > 0 ? "Turnos generados, falta asignar" : "Sin turnos generados para este mes"}
          </div>
        </div>
        <input className="at-input at-mono" type="month" value={mes} onChange={(e) => setMes(e.target.value)} />
      </div>

      {mesesConDatos.length > 0 && (
        <div style={{ display: "flex", gap: "6px", flexWrap: "wrap", marginBottom: "16px" }}>
          {mesesConDatos.map((m) => (
            <div key={m} className="at-chip at-mono" onClick={() => setMes(m)} style={{
              fontSize: "10.5px", padding: "4px 9px", borderRadius: "20px",
              border: `1px solid ${m === mes ? tokens.accent : tokens.border}`,
              background: m === mes ? "rgba(226,166,63,0.15)" : tokens.surfaceAlt,
              color: m === mes ? tokens.accent : tokens.muted,
            }}>
              {formatMesLargo(m)}{historial[m]?.asignacion ? " ✓" : ""}
            </div>
          ))}
        </div>
      )}

      {turnosDelMes.length === 0 ? (
        <div style={{ color: tokens.muted, fontSize: "13px" }}>
          Ve a la pestaña Asignación, elige este mes y genera los turnos para poder verlos aquí.
        </div>
      ) : (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: "5px", marginBottom: "6px" }}>
            {DIAS.map((d) => (
              <div key={d} className="at-mono" style={{ fontSize: "10px", color: tokens.muted, textAlign: "center", padding: "2px 0" }}>{d}</div>
            ))}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: "5px" }}>
            {celdas.map((c, i) => {
              if (!c) return <div key={i} />;
              const turnosDia = turnosPorFecha[c.fecha] || [];
              const esHoy = c.fecha === hoy;
              return (
                <div key={i} style={{
                  minHeight: "72px", border: `1px solid ${esHoy ? tokens.accent : tokens.border}`, borderRadius: "6px",
                  background: tokens.surface, padding: "4px 5px", display: "flex", flexDirection: "column", gap: "3px",
                }}>
                  <div className="at-mono" style={{ fontSize: "10px", color: esHoy ? tokens.accent : tokens.muted }}>{c.dia}</div>
                  {turnosDia.map((t) => {
                    const r = asignacion ? asignacion.resultados[t.id] : null;
                    const ok = r?.pair;
                    return (
                      <div key={t.id} title={`${t.sitio} ${t.inicio}–${t.fin}`} style={{
                        fontSize: "8.5px", lineHeight: 1.35, borderRadius: "4px", padding: "2px 4px",
                        background: !asignacion ? tokens.surfaceAlt : ok ? "rgba(73,179,166,0.14)" : "rgba(217,97,79,0.14)",
                        color: !asignacion ? tokens.muted : ok ? tokens.accent2 : tokens.warn,
                      }}>
                        <div className="at-mono" style={{ fontWeight: 600 }}>{t.inicio} · {t.sitio}</div>
                        {ok ? (
                          <div style={{ color: tokens.text }}>{nombreDe(r.pair[0])} · {nombreDe(r.pair[1])}</div>
                        ) : asignacion ? (
                          <div>Sin asignar</div>
                        ) : null}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
