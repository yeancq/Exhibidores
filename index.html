const Sun = (p) => <Icon {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></Icon>;

function timeKey(t) { return `${t.fecha}|${t.inicio}|${t.fin}`; }

function diffDias(fechaA, fechaB) {
  const a = new Date(fechaA + "T00:00:00");
  const b = new Date(fechaB + "T00:00:00");
  return Math.round((b - a) / 86400000);
}

// ¿Está esta persona de ausencia en una fecha concreta (según los periodos "desde/hasta")?
function estaAusenteEnFecha(p, fecha) {
  if (!p.ausencias || p.ausencias.length === 0 || !fecha) return false;
  return p.ausencias.some((a) => a.desde && a.hasta && a.desde <= fecha && a.hasta >= fecha);
}
function estaAusenteHoy(p) {
  return estaAusenteEnFecha(p, new Date().toISOString().slice(0, 10));
}

// ¿Está esta persona disponible para ESTE turno concreto (plantilla + fecha)?
// Combina: (1) el on/off general de disponibilidad para esa plantilla, (2) que no esté de ausencia
// esa fecha, y (3) si definió fechas específicas para esa plantilla, que la fecha sea una de ellas.
// Si no hay fechas específicas definidas (array vacío o inexistente), se mantiene el comportamiento
// de siempre: disponible todas las semanas que coincidan con la plantilla.
function disponibleParaTurno(p, t) {
  if (!p.disponibilidad[t.plantillaId]) return false;
  if (estaAusenteEnFecha(p, t.fecha)) return false;
  const fechasEspecificas = p.fechasPorTurno && p.fechasPorTurno[t.plantillaId];
  if (fechasEspecificas && fechasEspecificas.length > 0 && !fechasEspecificas.includes(t.fecha)) return false;
  return true;
}

// Genera los turnos reales (con fecha) de un mes "YYYY-MM" a partir de las plantillas recurrentes.
function generarTurnosMes(plantillas, mesStr) {
  if (!mesStr) return [];
  const [yearStr, monthStr] = mesStr.split("-");
  const year = parseInt(yearStr, 10);
  const month = parseInt(monthStr, 10) - 1;
  if (Number.isNaN(year) || Number.isNaN(month)) return [];
  const diasEnMes = new Date(year, month + 1, 0).getDate();
  const generados = [];
  for (let dia = 1; dia <= diasEnMes; dia++) {
    const fechaObj = new Date(year, month, dia);
    const diaAbrev = DIAS[(fechaObj.getDay() + 6) % 7]; // JS: Dom=0 -> alinear con DIAS (Lun..Dom)
    const fecha = `${year}-${String(month + 1).padStart(2, "0")}-${String(dia).padStart(2, "0")}`;
    plantillas.filter((pl) => pl.dia === diaAbrev).forEach((pl) => {
      generados.push({ id: uid(), plantillaId: pl.id, fecha, dia: diaAbrev, sitio: pl.sitio, inicio: pl.inicio, fin: pl.fin });
    });
  }
  generados.sort((a, b) => a.fecha === b.fecha ? a.inicio.localeCompare(b.inicio) : a.fecha.localeCompare(b.fecha));
  return generados;
}

// Preferencia efectiva de una persona para un turno concreto:
// prioriza la preferencia específica de ese turno; si no hay, usa la preferencia general.
function obtenerPreferencia(p, plantillaId) {
  const especifica = p.preferenciasPorTurno && p.preferenciasPorTurno[plantillaId];
  if (especifica && especifica.partnerId) return especifica;
  if (p.prefPartnerId) return { partnerId: p.prefPartnerId, tipo: p.prefTipo || "blanda" };
  return null;
}

// Calcula, para cada turno, su "rango intercalado" dentro de su propia plantilla (mismo día/sitio/horario
// que se repite cada semana). En vez de 0,1,2,3,4 (orden cronológico puro) da 0,2,4,1,3 (primero las
// fechas "pares" del ciclo, luego las "impares"). Esto se usa como desempate al ordenar los turnos:
// cuando dos o más turnos de la misma plantilla tienen la misma cantidad de gente disponible (lo habitual,
// porque la disponibilidad se marca por plantilla y no cambia semana a semana), evita que una pareja
// forzada (p. ej. solo 2 personas disponibles para ese turno) agote su cupo mensual en las primeras
// semanas consecutivas del mes; en vez de eso, sus turnos quedan repartidos/alternados.
function calcularRangoIntercalado(turnosDelMes) {
  const porPlantilla = {};
  turnosDelMes.forEach((t) => {
    if (!porPlantilla[t.plantillaId]) porPlantilla[t.plantillaId] = [];
    porPlantilla[t.plantillaId].push(t);
  });
  const rango = {};
  Object.values(porPlantilla).forEach((grupo) => {
    // grupo ya está en orden cronológico porque turnosDelMes viene ordenado por fecha
    const pares = [];
    const impares = [];
    grupo.forEach((t, idx) => (idx % 2 === 0 ? pares : impares).push(t));
    [...pares, ...impares].forEach((t, rangoIdx) => { rango[t.id] = rangoIdx; });
  });
  return rango;
}

function assignTurnos(participantes, turnosDelMes, asignacionManual = {}) {
  const disponibles = (t) => participantes.filter((p) => disponibleParaTurno(p, t));
  const rangoIntercalado = calcularRangoIntercalado(turnosDelMes);

  const asignadosCount = {};
  participantes.forEach((p) => (asignadosCount[p.id] = 0));
  const timeUsado = {};
  participantes.forEach((p) => (timeUsado[p.id] = new Set()));
  const fechasAsignadas = {};
  participantes.forEach((p) => (fechasAsignadas[p.id] = []));
  const resultados = {};

  // Aplica primero las asignaciones manuales: quedan fijas tal cual las eligió la persona,
  // y sus dos integrantes se descuentan del cupo mensual y se tienen en cuenta para el
  // espaciado, igual que si el algoritmo automático los hubiera puesto ahí.
  const turnosPorId = {};
  turnosDelMes.forEach((t) => (turnosPorId[t.id] = t));
  Object.keys(asignacionManual).forEach((turnoId) => {
    const t = turnosPorId[turnoId];
    const pair = asignacionManual[turnoId];
    if (!t || !pair || pair.length !== 2 || !pair[0] || !pair[1]) return;
    const [id1, id2] = pair;
    const p1 = participantes.find((p) => p.id === id1);
    const p2 = participantes.find((p) => p.id === id2);
    if (!p1 || !p2) return;
    resultados[t.id] = { pair: [id1, id2], reason: null, manual: true };
    asignadosCount[id1] = (asignadosCount[id1] || 0) + 1;
    asignadosCount[id2] = (asignadosCount[id2] || 0) + 1;
    const tk = timeKey(t);
    timeUsado[id1].add(tk);
    timeUsado[id2].add(tk);
    fechasAsignadas[id1].push(t.fecha);
    fechasAsignadas[id2].push(t.fecha);
  });

  const turnosAutomaticos = turnosDelMes.filter((t) => !resultados[t.id]);
  const orden = [...turnosAutomaticos].sort((a, b) => {
    const diff = disponibles(a).length - disponibles(b).length;
    if (diff !== 0) return diff;
    return rangoIntercalado[a.id] - rangoIntercalado[b.id];
  });

  // Días totales del mes que se está asignando (para calcular el espaciado ideal de cada persona).
  const diasEnMes = turnosDelMes.length
    ? new Date(parseInt(turnosDelMes[0].fecha.slice(0, 4), 10), parseInt(turnosDelMes[0].fecha.slice(5, 7), 10), 0).getDate()
    : 30;

  // Espaciado ideal en días entre dos turnos de una misma persona, según su máximo mensual.
  // Ej: máximo 2 -> cada ~15 días; máximo 4 -> cada ~7 días.
  const espaciadoIdeal = (p) => {
    const max = p.maxTurnosMes ?? 4;
    return max > 0 ? diasEnMes / max : diasEnMes;
  };

  // Qué tan "lista" está una persona para un nuevo turno en esta fecha, según cuándo fue su turno más cercano.
  // >= 0 favorable (ya pasó su espaciado ideal o es su primer turno); negativo = penaliza asignarla demasiado pronto.
  const puntajeEspaciado = (p, fecha) => {
    const fechas = fechasAsignadas[p.id];
    if (fechas.length === 0) return 0.5;
    const distanciaMin = Math.min(...fechas.map((f) => Math.abs(diffDias(f, fecha))));
    const ideal = espaciadoIdeal(p);
    const ratio = ideal > 0 ? distanciaMin / ideal : 1;
    if (ratio < 1) return (ratio - 1) * 6; // penalización fuerte por quedar muy seguido
    return Math.min(ratio - 1, 1) * 0.5; // pequeño extra por haber esperado lo suficiente
  };

  for (const t of orden) {
    const tk = timeKey(t);
    let pool = disponibles(t).filter((p) => !timeUsado[p.id].has(tk) && asignadosCount[p.id] < (p.maxTurnosMes ?? Infinity));

    if (pool.length < 2) {
      const disponiblesSinLimite = disponibles(t).filter((p) => !timeUsado[p.id].has(tk));
      const bloqueadoPorLimite = disponiblesSinLimite.length >= 2 && pool.length < disponiblesSinLimite.length;
      resultados[t.id] = {
        pair: null,
        reason: disponiblesSinLimite.length === 0
          ? "Nadie disponible para este turno."
          : bloqueadoPorLimite
            ? "Las personas disponibles ya alcanzaron su máximo de participaciones este mes."
            : "Solo hay una persona disponible; falta pareja.",
      };
      continue;
    }

    const poolIds = new Set(pool.map((p) => p.id));
    pool = pool.filter((p) => {
      const pref = obtenerPreferencia(p, t.plantillaId);
      if (pref && pref.tipo === "dura") return poolIds.has(pref.partnerId);
      return true;
    });

    if (pool.length < 2) {
      const bloqueado = disponibles(t).find((p) => {
        const pref = obtenerPreferencia(p, t.plantillaId);
        return pref && pref.tipo === "dura" && !poolIds.has(pref.partnerId);
      });
      resultados[t.id] = {
        pair: null,
        reason: bloqueado
          ? `${bloqueado.nombre} exige trabajar con su pareja fija, pero no coincide en este turno.`
          : "No hay suficientes personas compatibles.",
      };
      continue;
    }

    let mejor = null;
    let mejorScore = -Infinity;
    let hayParSinRestriccionGenero = false;
    for (let i = 0; i < pool.length; i++) {
      for (let j = i + 1; j < pool.length; j++) {
        const a = pool[i], b = pool[j];
        const prefA = obtenerPreferencia(a, t.plantillaId);
        const prefB = obtenerPreferencia(b, t.plantillaId);
        if (prefA && prefA.tipo === "dura" && prefA.partnerId !== b.id) continue;
        if (prefB && prefB.tipo === "dura" && prefB.partnerId !== a.id) continue;
        const aQuiereB = prefA && prefA.partnerId === b.id;
        const bQuiereA = prefB && prefB.partnerId === a.id;
        const hayPreferenciaEstablecida = aQuiereB || bQuiereA;
        hayParSinRestriccionGenero = true;
        // Mismo género entre sí, salvo que haya una preferencia establecida entre ambos
        // (si alguno no tiene género especificado, no se aplica la restricción).
        if (!hayPreferenciaEstablecida && a.genero && b.genero && a.genero !== b.genero) continue;
        let score = 0;
        if (aQuiereB && bQuiereA) score += 5;
        else if (aQuiereB || bQuiereA) score += 3;
        const carga = asignadosCount[a.id] + asignadosCount[b.id];
        score -= carga * 0.3;
        score += puntajeEspaciado(a, t.fecha) + puntajeEspaciado(b, t.fecha);
        if (score > mejorScore) { mejorScore = score; mejor = [a, b]; }
      }
    }

    if (!mejor) {
      resultados[t.id] = {
        pair: null,
        reason: hayParSinRestriccionGenero
          ? "Las personas disponibles son de géneros distintos entre sí y no hay preferencia establecida."
          : "No se encontró una pareja compatible.",
      };
      continue;
    }

    resultados[t.id] = { pair: [mejor[0].id, mejor[1].id], reason: null };
    asignadosCount[mejor[0].id]++;
    asignadosCount[mejor[1].id]++;
    timeUsado[mejor[0].id].add(tk);
    timeUsado[mejor[1].id].add(tk);
    fechasAsignadas[mejor[0].id].push(t.fecha);
    fechasAsignadas[mejor[1].id].push(t.fecha);
  }

  return { resultados, asignadosCount };
}

function AsignadorTurnos() {
  const [tab, setTab] = useState("plantillas");
  const [plantillas, setPlantillas] = useState(() => GUARDADO?.plantillas || PLANTILLAS_INICIALES);
  const [participantes, setParticipantes] = useState(() => GUARDADO?.participantes || participantesIniciales());
  const [nombreNuevo, setNombreNuevo] = useState("");
  const [mes, setMesState] = useState(() => GUARDADO?.ultimoMes || new Date().toISOString().slice(0, 7));
  const [historial, setHistorial] = useState(() => GUARDADO?.historial || {});
  const guardadoDelMes = historial[mes];
  const [turnosDelMes, setTurnosDelMes] = useState(() => guardadoDelMes?.turnosDelMes || []);
  const [asignacion, setAsignacion] = useState(() => guardadoDelMes?.asignacion || null);
  const [asignacionManual, setAsignacionManual] = useState(() => guardadoDelMes?.asignacionManual || {});
  const [tema, setTema] = useState(() => GUARDADO?.tema || "oscuro");
  const paleta = tema === "claro" ? TOKENS_CLARO : TOKENS_OSCURO;
  const alternarTema = () => setTema((t) => (t === "oscuro" ? "claro" : "oscuro"));

  // Guarda automáticamente en este navegador cada vez que algo cambia.
  useEffect(() => {
    try {
      if (typeof localStorage === "undefined") return;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ plantillas, participantes, historial, ultimoMes: mes, tema }));
    } catch (e) { /* almacenamiento no disponible */ }
  }, [plantillas, participantes, historial, mes, tema]);

  // El área fuera de la tarjeta redondeada (el "gutter" de la página) también sigue el tema activo.
  useEffect(() => {
    try {
      if (typeof document !== "undefined") document.body.style.background = paleta.pagina;
    } catch (e) { /* no disponible */ }
  }, [paleta.pagina]);

  // Al cambiar de mes, recupera lo que ya estaba grabado para ese mes (si existe).
  const cambiarMes = (nuevoMes) => {
    setMesState(nuevoMes);
    const g = historial[nuevoMes];
    setTurnosDelMes(g?.turnosDelMes || []);
    setAsignacion(g?.asignacion || null);
    setAsignacionManual(g?.asignacionManual || {});
  };

  const addTurno = () => setPlantillas((t) => [...t, { id: uid(), dia: "Lun", sitio: "", inicio: "08:00", fin: "16:00" }]);
  const duplicarTurno = (id) => setPlantillas((t) => {
    const orig = t.find((x) => x.id === id);
    if (!orig) return t;
    return [...t, { ...orig, id: uid() }];
  });
  const updateTurno = (id, field, value) => setPlantillas((t) => t.map((x) => (x.id === id ? { ...x, [field]: value } : x)));
  const removeTurno = (id) => {
    setPlantillas((t) => t.filter((x) => x.id !== id));
    setParticipantes((ps) => ps.map((p) => {
      const disp = { ...p.disponibilidad };
      delete disp[id];
      const fechasPorTurno = { ...(p.fechasPorTurno || {}) };
      delete fechasPorTurno[id];
      return { ...p, disponibilidad: disp, fechasPorTurno };
    }));
    setTurnosDelMes((tm) => {
      const restantes = tm.filter((t) => t.plantillaId !== id);
      const idsRestantes = new Set(restantes.map((t) => t.id));
      setAsignacionManual((am) => {
        const nuevo = {};
        Object.keys(am).forEach((tid) => { if (idsRestantes.has(tid)) nuevo[tid] = am[tid]; });
        return nuevo;
      });
      return restantes;
    });
    setAsignacion(null);
    setHistorial((h) => {
      if (!h[mes]) return h;
      const turnosRestantes = h[mes].turnosDelMes.filter((t) => t.plantillaId !== id);
      const idsRestantes = new Set(turnosRestantes.map((t) => t.id));
      const manualRestante = {};
      Object.keys(h[mes].asignacionManual || {}).forEach((tid) => { if (idsRestantes.has(tid)) manualRestante[tid] = h[mes].asignacionManual[tid]; });
      return { ...h, [mes]: { turnosDelMes: turnosRestantes, asignacion: null, asignacionManual: manualRestante } };
    });
  };

  const generarMes = () => {
    const nuevos = generarTurnosMes(plantillas, mes);
    setTurnosDelMes(nuevos);
    setAsignacion(null);
    setAsignacionManual({});
    setHistorial((h) => ({ ...h, [mes]: { turnosDelMes: nuevos, asignacion: null, asignacionManual: {} } }));
  };

  const addParticipante = () => {
    const nombre = nombreNuevo.trim();
    if (!nombre) return;
    setParticipantes((ps) => [...ps, { id: uid(), nombre, genero: null, disponibilidad: {}, prefPartnerId: null, prefTipo: "blanda", preferenciasPorTurno: {}, fechasPorTurno: {}, ausencias: [], maxTurnosMes: 4 }]);
    setNombreNuevo("");
    setAsignacion(null);
  };
  const removeParticipante = (id) => {
    setParticipantes((ps) => ps.filter((p) => p.id !== id).map((p) => {
      const limpio = p.prefPartnerId === id ? { ...p, prefPartnerId: null } : p;
      const preferenciasPorTurno = { ...(limpio.preferenciasPorTurno || {}) };
      let cambio = false;
      Object.keys(preferenciasPorTurno).forEach((tid) => {
        if (preferenciasPorTurno[tid]?.partnerId === id) { delete preferenciasPorTurno[tid]; cambio = true; }
      });
      return cambio ? { ...limpio, preferenciasPorTurno } : limpio;
    }));
    setAsignacion(null);
    setAsignacionManual((am) => {
      const nuevo = {};
      let cambio = false;
      Object.keys(am).forEach((tid) => {
        if (am[tid].includes(id)) { cambio = true; return; }
        nuevo[tid] = am[tid];
      });
      return cambio ? nuevo : am;
    });
  };
  const toggleDisponibilidad = (participanteId, turnoId) => {
    setParticipantes((ps) => ps.map((p) => (p.id === participanteId
      ? { ...p, disponibilidad: { ...p.disponibilidad, [turnoId]: !p.disponibilidad[turnoId] } }
      : p)));
    setAsignacion(null);
  };
  const updateParticipante = (id, field, value) => {
    setParticipantes((ps) => ps.map((p) => (p.id === id ? { ...p, [field]: value } : p)));
    setAsignacion(null);
  };
  const setPreferenciaTurno = (participanteId, turnoId, partnerId, tipo) => {
    setParticipantes((ps) => ps.map((p) => {
      if (p.id !== participanteId) return p;
      const preferenciasPorTurno = { ...(p.preferenciasPorTurno || {}) };
      if (!partnerId) delete preferenciasPorTurno[turnoId];
      else preferenciasPorTurno[turnoId] = { partnerId, tipo: tipo || "blanda" };
      return { ...p, preferenciasPorTurno };
    }));
    setAsignacion(null);
  };

  // Guarda las fechas específicas (dentro de una plantilla recurrente) en las que una persona puede
  // ser asignada. Un array vacío o ausente significa "sin restricción" (disponible todas las semanas,
  // el comportamiento de siempre). No toca ningún otro parámetro de la persona.
  const setFechasTurno = (participanteId, turnoId, fechas) => {
    setParticipantes((ps) => ps.map((p) => {
      if (p.id !== participanteId) return p;
      const fechasPorTurno = { ...(p.fechasPorTurno || {}) };
      if (!fechas || fechas.length === 0) delete fechasPorTurno[turnoId];
      else fechasPorTurno[turnoId] = fechas;
      return { ...p, fechasPorTurno };
    }));
    setAsignacion(null);
  };

  const addAusencia = (id) => {
    setParticipantes((ps) => ps.map((p) => (p.id === id ? { ...p, ausencias: [...(p.ausencias || []), { desde: "", hasta: "" }] } : p)));
    setAsignacion(null);
  };
  const updateAusencia = (id, idx, field, value) => {
    setParticipantes((ps) => ps.map((p) => {
      if (p.id !== id) return p;
      const ausencias = p.ausencias.map((a, i) => (i === idx ? { ...a, [field]: value } : a));
      return { ...p, ausencias };
    }));
    setAsignacion(null);
  };
  const removeAusencia = (id, idx) => {
    setParticipantes((ps) => ps.map((p) => {
      if (p.id !== id) return p;
      return { ...p, ausencias: p.ausencias.filter((_, i) => i !== idx) };
    }));
    setAsignacion(null);
  };

  const generar = () => {
    const { resultados, asignadosCount } = assignTurnos(participantes, turnosDelMes, asignacionManual);
    const nuevaAsignacion = { resultados, asignadosCount };
    setAsignacion(nuevaAsignacion);
    setHistorial((h) => ({ ...h, [mes]: { turnosDelMes, asignacion: nuevaAsignacion, asignacionManual } }));
  };

  // Fija (o quita, si pair es null) la pareja manual de un turno concreto. Esta asignación
  // queda "protegida": se muestra de inmediato y, al pulsar "Generar asignación", el algoritmo
  // automático la respeta y solo rellena el resto de turnos a su alrededor.
  const setManual = (turnoId, pair) => {
    setAsignacionManual((am) => {
      const nuevo = { ...am };
      if (!pair) delete nuevo[turnoId];
      else nuevo[turnoId] = pair;
      setHistorial((h) => ({ ...h, [mes]: { turnosDelMes, asignacion, asignacionManual: nuevo } }));
      return nuevo;
    });
  };

  const porDia = useMemo(() => {
    const map = {};
    DIAS.forEach((d) => (map[d] = []));
    plantillas.forEach((t) => { if (!map[t.dia]) map[t.dia] = []; map[t.dia].push(t); });
    return map;
  }, [plantillas]);

  const nombreDe = (id) => participantes.find((p) => p.id === id)?.nombre || "?";
  const cubiertos = turnosDelMes.filter((t) => asignacionManual[t.id] || asignacion?.resultados[t.id]?.pair).length;

  const reiniciarTodo = () => {
    if (!confirm("Esto borra todos los datos guardados en este navegador (plantillas, participantes e historial de asignaciones). ¿Continuar?")) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    setPlantillas(PLANTILLAS_INICIALES);
    setParticipantes(participantesIniciales());
    setHistorial({});
    setTurnosDelMes([]);
    setAsignacion(null);
  };

  // --- Respaldo: exportar todo el estado a un .json descargable, e importarlo de vuelta ---
  const exportarRespaldo = () => {
    const datos = {
      tipo: "asignador-turnos-respaldo",
      version: 1,
      exportadoEl: new Date().toISOString(),
      plantillas, participantes, historial, ultimoMes: mes,
    };
    const blob = new Blob([JSON.stringify(datos, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const fecha = new Date().toISOString().slice(0, 10);
    a.download = `respaldo-turnos-${fecha}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const importarRespaldoRef = React.useRef(null);
  const dispararImportar = () => importarRespaldoRef.current && importarRespaldoRef.current.click();
  const importarRespaldo = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // permite volver a elegir el mismo archivo si hace falta
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      let datos;
      try {
        datos = JSON.parse(ev.target.result);
      } catch (err) {
        alert("Ese archivo no es un respaldo válido (JSON incorrecto).");
        return;
      }
      if (!datos || !Array.isArray(datos.participantes) || !Array.isArray(datos.plantillas)) {
        alert("Ese archivo no parece ser un respaldo de esta app.");
        return;
      }
      if (!confirm("Esto reemplaza los turnos, participantes e historial actuales de este dispositivo por los del respaldo. ¿Continuar?")) return;
      setPlantillas(datos.plantillas);
      setParticipantes(datos.participantes);
      setHistorial(datos.historial || {});
      const mesRestaurado = datos.ultimoMes || new Date().toISOString().slice(0, 7);
      setMesState(mesRestaurado);
      const g = (datos.historial || {})[mesRestaurado];
      setTurnosDelMes(g?.turnosDelMes || []);
      setAsignacion(g?.asignacion || null);
      alert("Respaldo importado correctamente.");
    };
    reader.onerror = () => alert("No se pudo leer el archivo.");
    reader.readAsText(file);
  };

  return (
    <div style={{
      background: tokens.bg, color: tokens.text,
      fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif",
      minHeight: "100%", borderRadius: "12px", overflow: "hidden", border: `1px solid ${tokens.border}`,
      "--at-bg": paleta.bg, "--at-surface": paleta.surface, "--at-surface-alt": paleta.surfaceAlt,
      "--at-border": paleta.border, "--at-text": paleta.text, "--at-muted": paleta.muted,
      "--at-accent": paleta.accent, "--at-accent2": paleta.accent2, "--at-warn": paleta.warn,
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
        .at-mono { font-family: 'IBM Plex Mono', monospace; }
        .at-display { font-family: 'Space Grotesk', sans-serif; }
        .at-tab { transition: all 0.15s ease; }
        .at-tab:hover { color: ${tokens.text} !important; }
        .at-chip { transition: all 0.12s ease; cursor: pointer; user-select: none; }
        .at-chip:hover { border-color: ${tokens.accent} !important; }
        .at-btn { transition: all 0.15s ease; cursor: pointer; }
        .at-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .at-row:hover { background: ${tokens.surfaceAlt} !important; }
        .at-input, .at-select {
          background: ${tokens.surfaceAlt}; border: 1px solid ${tokens.border}; color: ${tokens.text};
          border-radius: 6px; padding: 7px 10px; font-size: 13px; font-family: inherit;
        }
        .at-input:focus, .at-select:focus { outline: 1px solid ${tokens.accent}; }
        ::placeholder { color: ${tokens.muted}; }
      `}</style>

      <div style={{ padding: "20px 24px 16px", borderBottom: `1px solid ${tokens.border}`, background: tokens.surface, display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: "12px" }}>
        <div>
          <div className="at-display" style={{ fontSize: "20px", fontWeight: 700, letterSpacing: "-0.01em" }}>Asignador de turnos</div>
          <div style={{ fontSize: "12.5px", color: tokens.muted, marginTop: "2px" }}>Turnos en pareja · disponibilidad y preferencias</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap", justifyContent: "flex-end" }}>
          <button className="at-btn" onClick={alternarTema} title={tema === "oscuro" ? "Cambiar a modo claro" : "Cambiar a modo oscuro"} style={{
            display: "flex", alignItems: "center", gap: "6px",
            background: tokens.surfaceAlt, border: `1px solid ${tokens.border}`, borderRadius: "6px",
            padding: "6px 10px", color: tokens.accent, fontSize: "11px", fontWeight: 600, whiteSpace: "nowrap",
          }}>
            {tema === "oscuro" ? <Sun size={12} /> : <Moon size={12} />} {tema === "oscuro" ? "Modo claro" : "Modo oscuro"}
          </button>
          <input ref={importarRespaldoRef} type="file" accept="application/json,.json" onChange={importarRespaldo} style={{ display: "none" }} />
          <button className="at-btn" onClick={dispararImportar} title="Restaurar un respaldo .json exportado desde otro dispositivo" style={{
            display: "flex", alignItems: "center", gap: "6px",
            background: "transparent", border: `1px solid ${tokens.border}`, borderRadius: "6px",
            padding: "6px 10px", color: tokens.muted, fontSize: "11px", fontWeight: 600, whiteSpace: "nowrap",
          }}>
            Importar respaldo
          </button>
          <button className="at-btn" onClick={exportarRespaldo} title="Descargar un archivo .json con todos los datos, para pasarlo a otro dispositivo" style={{
            display: "flex", alignItems: "center", gap: "6px",
            background: tokens.surfaceAlt, border: `1px solid ${tokens.border}`, borderRadius: "6px",
            padding: "6px 10px", color: tokens.accent2, fontSize: "11px", fontWeight: 600, whiteSpace: "nowrap",
          }}>
            <Download size={12} /> Exportar respaldo
          </button>
          <button className="at-btn" onClick={reiniciarTodo} title="Borrar todos los datos guardados en este navegador" style={{
            background: "transparent", border: `1px solid ${tokens.border}`, borderRadius: "6px",
            padding: "6px 10px", color: tokens.muted, fontSize: "11px", fontWeight: 600, whiteSpace: "nowrap",
          }}>
            Reiniciar datos
          </button>
        </div>
      </div>

      <div style={{ display: "flex", gap: "2px", padding: "10px 24px 0", background: tokens.surface, borderBottom: `1px solid ${tokens.border}` }}>
        {[
          { id: "plantillas", label: "Plantillas", icon: CalendarClock },
          { id: "participantes", label: "Participantes", icon: Users },
          { id: "asignacion", label: "Asignación", icon: Shuffle },
          { id: "calendario", label: "Calendario", icon: CalendarX },
        ].map((t) => {
          const IconC = t.icon;
          const active = tab === t.id;
          return (
            <button key={t.id} className="at-tab" onClick={() => setTab(t.id)} style={{
              display: "flex", alignItems: "center", gap: "6px", padding: "10px 16px", background: "transparent",
              border: "none", borderBottom: active ? `2px solid ${tokens.accent}` : "2px solid transparent",
              color: active ? tokens.accent : tokens.muted, fontSize: "13px", fontWeight: 600, cursor: "pointer",
            }}>
              <IconC size={14} />{t.label}
              {t.id === "plantillas" && <span className="at-mono" style={{ fontSize: "10.5px", color: tokens.muted }}>{plantillas.length}</span>}
              {t.id === "participantes" && <span className="at-mono" style={{ fontSize: "10.5px", color: tokens.muted }}>{participantes.length}</span>}
            </button>
          );
        })}
      </div>

      <div style={{ padding: "22px 24px 28px" }}>
        {tab === "plantillas" && (
          <TurnosTab turnos={plantillas} addTurno={addTurno} updateTurno={updateTurno} removeTurno={removeTurno} duplicarTurno={duplicarTurno} />
        )}
        {tab === "participantes" && (
          <ParticipantesTab
            participantes={participantes} turnos={plantillas} porDia={porDia} mes={mes}
            nombreNuevo={nombreNuevo} setNombreNuevo={setNombreNuevo}
            addParticipante={addParticipante} removeParticipante={removeParticipante}
            toggleDisponibilidad={toggleDisponibilidad} updateParticipante={updateParticipante}
            setPreferenciaTurno={setPreferenciaTurno} setFechasTurno={setFechasTurno}
            addAusencia={addAusencia} updateAusencia={updateAusencia} removeAusencia={removeAusencia}
          />
        )}
        {tab === "asignacion" && (
          <AsignacionTab plantillas={plantillas} participantes={participantes}
            mes={mes} setMes={cambiarMes} turnosDelMes={turnosDelMes} generarMes={generarMes}
            asignacion={asignacion} generar={generar} nombreDe={nombreDe} cubiertos={cubiertos}
            asignacionManual={asignacionManual} setManual={setManual} />
        )}
        {tab === "calendario" && (
          <CalendarioTab mes={mes} setMes={cambiarMes} turnosDelMes={turnosDelMes} asignacion={asignacion} nombreDe={nombreDe} historial={historial} asignacionManual={asignacionManual} />
        )}
      </div>
    </div>
  );
}

function TurnosTab({ turnos, addTurno, updateTurno, removeTurno, duplicarTurno }) {
  return (
    <div>
      <div style={{ fontSize: "12.5px", color: tokens.muted, marginBottom: "14px", lineHeight: 1.5 }}>
        Define los turnos recurrentes: día de la semana, sitio y horario. Cada turno se cubre con dos personas.
        Estas plantillas se repiten todas las semanas — en la pestaña Asignación las conviertes en fechas concretas de un mes.
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
        <div style={{ display: "grid", gridTemplateColumns: "90px 1fr 100px 100px 32px", gap: "8px", padding: "0 10px", fontSize: "11px", color: tokens.muted, textTransform: "uppercase", letterSpacing: "0.04em" }}>
          <span>Día</span><span>Sitio</span><span>Inicio</span><span>Fin</span><span></span>
        </div>
        {turnos.map((t) => (
          <div key={t.id} className="at-row" style={{ display: "grid", gridTemplateColumns: "90px 1fr 100px 100px 32px 32px", gap: "8px", alignItems: "center", padding: "8px 10px", borderRadius: "8px", border: `1px solid ${tokens.border}`, background: tokens.surface }}>
            <select className="at-select" value={t.dia} onChange={(e) => updateTurno(t.id, "dia", e.target.value)}>
              {DIAS.map((d) => <option key={d} value={d}>{d}</option>)}
            </select>
            <input className="at-input" placeholder="Nombre del sitio" value={t.sitio} onChange={(e) => updateTurno(t.id, "sitio", e.target.value)} />
            <input className="at-input at-mono" type="time" value={t.inicio} onChange={(e) => updateTurno(t.id, "inicio", e.target.value)} />
            <input className="at-input at-mono" type="time" value={t.fin} onChange={(e) => updateTurno(t.id, "fin", e.target.value)} />
            <button className="at-btn" onClick={() => duplicarTurno(t.id)} title="Duplicar" style={{ background: tokens.surfaceAlt, border: `1px solid ${tokens.border}`, borderRadius: "6px", color: tokens.muted, width: "32px", height: "32px", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Copy size={13} />
            </button>
            <button className="at-btn" onClick={() => removeTurno(t.id)} title="Eliminar" style={{ background: tokens.surfaceAlt, border: `1px solid ${tokens.border}`, borderRadius: "6px", color: tokens.warn, width: "32px", height: "32px", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Trash2 size={13} />
            </button>
          </div>
        ))}
      </div>
      <button className="at-btn" onClick={addTurno} style={{ marginTop: "12px", display: "flex", alignItems: "center", gap: "6px", background: tokens.surfaceAlt, border: `1px dashed ${tokens.border}`, borderRadius: "8px", padding: "9px 14px", color: tokens.accent, fontSize: "13px", fontWeight: 600 }}>
        <Plus size={14} /> Agregar turno
      </button>
    </div>
  );
}

function normalizarTexto(s) {
  return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

// Pequeño calendario mensual para elegir, dentro de una plantilla recurrente (p. ej. "Sáb 11:00–13:00"),
// las fechas concretas en las que una persona puede ser asignada. Solo se pueden marcar los días que
// coinciden con el día de la semana de la plantilla (los demás salen atenuados). Si no hay ninguna fecha
// marcada, no hay restricción: la persona sigue disponible todas las semanas, como antes.
function SelectorFechasTurno({ turnoDia, fechasSeleccionadas, onChange, mesInicial }) {
  const [mesVista, setMesVista] = useState(mesInicial);
  const celdas = useMemo(() => construirCeldas(mesVista), [mesVista]);
  const seleccionadas = new Set(fechasSeleccionadas || []);

  const cambiarMes = (delta) => {
    const [y, m] = mesVista.split("-").map((n) => parseInt(n, 10));
    const d = new Date(y, m - 1 + delta, 1);
    setMesVista(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  };

  const toggleFecha = (fecha) => {
    const nuevas = new Set(seleccionadas);
    if (nuevas.has(fecha)) nuevas.delete(fecha); else nuevas.add(fecha);
    onChange(Array.from(nuevas));
  };

  return (
    <div style={{
      marginTop: "6px", padding: "10px", borderRadius: "8px",
      border: `1px solid ${tokens.border}`, background: tokens.surfaceAlt, maxWidth: "280px",
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "8px" }}>
        <button className="at-btn" onClick={() => cambiarMes(-1)} style={{ background: "transparent", border: `1px solid ${tokens.border}`, borderRadius: "4px", color: tokens.muted, width: "20px", height: "20px", fontSize: "11px", cursor: "pointer" }}>‹</button>
        <span className="at-mono" style={{ fontSize: "11px", color: tokens.text, textTransform: "capitalize" }}>{formatMesLargo(mesVista)}</span>
        <button className="at-btn" onClick={() => cambiarMes(1)} style={{ background: "transparent", border: `1px solid ${tokens.border}`, borderRadius: "4px", color: tokens.muted, width: "20px", height: "20px", fontSize: "11px", cursor: "pointer" }}>›</button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: "3px", marginBottom: "3px" }}>
        {DIAS.map((d) => (
          <div key={d} className="at-mono" style={{ fontSize: "8.5px", color: tokens.muted, textAlign: "center" }}>{d[0]}</div>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: "3px" }}>
        {celdas.map((c, i) => {
          if (!c) return <div key={i} />;
          const diaAbrev = DIAS[(new Date(c.fecha + "T00:00:00").getDay() + 6) % 7];
          const esDelTurno = diaAbrev === turnoDia;
          const sel = seleccionadas.has(c.fecha);
          return (
            <div key={i} className={esDelTurno ? "at-chip" : ""} onClick={() => esDelTurno && toggleFecha(c.fecha)} style={{
              textAlign: "center", fontSize: "10px", padding: "4px 0", borderRadius: "4px",
              cursor: esDelTurno ? "pointer" : "default",
              opacity: esDelTurno ? 1 : 0.28,
              border: `1px solid ${sel ? tokens.accent : "transparent"}`,
              background: sel ? "rgba(226,166,63,0.2)" : "transparent",
              color: sel ? tokens.accent : tokens.text,
              fontWeight: sel ? 700 : 400,
            }}>
              {c.dia}
            </div>
          );
        })}
      </div>
      <div style={{ marginTop: "8px", fontSize: "10.5px", color: tokens.muted, display: "flex", alignItems: "center", justifyContent: "space-between", gap: "6px" }}>
        <span>{seleccionadas.size === 0 ? "Sin restricción: todas las semanas" : `${seleccionadas.size} fecha${seleccionadas.size === 1 ? "" : "s"} marcada${seleccionadas.size === 1 ? "" : "s"}`}</span>
        {seleccionadas.size > 0 && (
          <button className="at-btn" onClick={() => onChange([])} style={{ background: "transparent", border: "none", color: tokens.warn, fontSize: "10.5px", cursor: "pointer", textDecoration: "underline", padding: 0 }}>
            Quitar
          </button>
        )}
      </div>
    </div>
  );
}

function ParticipantesTab({ participantes, turnos, porDia, mes, nombreNuevo, setNombreNuevo, addParticipante, removeParticipante, toggleDisponibilidad, updateParticipante, setPreferenciaTurno, setFechasTurno, addAusencia, updateAusencia, removeAusencia }) {
  const [fechasAbiertoPara, setFechasAbiertoPara] = useState(null); // `${participanteId}:${turnoId}` o null
  const [busqueda, setBusqueda] = useState("");
  const busquedaNorm = normalizarTexto(busqueda.trim());
  const participantesFiltrados = busquedaNorm
    ? participantes.filter((p) => normalizarTexto(p.nombre).includes(busquedaNorm))
    : participantes;

  return (
    <div>
      <div style={{ display: "flex", gap: "8px", marginBottom: "10px" }}>
        <input className="at-input" style={{ flex: 1 }} placeholder="Nombre del participante" value={nombreNuevo}
          onChange={(e) => setNombreNuevo(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addParticipante()} />
        <button className="at-btn" onClick={addParticipante} style={{ display: "flex", alignItems: "center", gap: "6px", background: tokens.accent, border: "none", borderRadius: "8px", padding: "0 16px", color: "#1a1206", fontSize: "13px", fontWeight: 700 }}>
          <Plus size={14} /> Agregar
        </button>
      </div>

      {participantes.length > 0 && (
        <div style={{ position: "relative", marginBottom: "18px" }}>
          <input className="at-input" style={{ width: "100%", paddingLeft: "32px" }} placeholder="Buscar participante por nombre…"
            value={busqueda} onChange={(e) => setBusqueda(e.target.value)} />
          <span style={{ position: "absolute", left: "10px", top: "50%", transform: "translateY(-50%)", color: tokens.muted, display: "flex" }}>
            <Icon size={14}><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></Icon>
          </span>
          {busqueda && (
            <button className="at-btn" onClick={() => setBusqueda("")} title="Limpiar búsqueda" style={{
              position: "absolute", right: "8px", top: "50%", transform: "translateY(-50%)",
              background: "transparent", border: "none", color: tokens.muted, fontSize: "16px", lineHeight: 1, cursor: "pointer", padding: "2px 4px",
            }}>×</button>
          )}
          {busquedaNorm && (
            <div style={{ fontSize: "11px", color: tokens.muted, marginTop: "6px" }}>
              {participantesFiltrados.length} de {participantes.length} coincide{participantesFiltrados.length === 1 ? "" : "n"}
            </div>
          )}
        </div>
      )}

      {participantes.length === 0 && (
        <div style={{ color: tokens.muted, fontSize: "13px", padding: "20px 0" }}>Todavía no hay participantes. Agrega el primero arriba.</div>
      )}

      {busquedaNorm && participantesFiltrados.length === 0 && (
        <div style={{ color: tokens.muted, fontSize: "13px", padding: "20px 0" }}>No se encontró ningún participante con "{busqueda}".</div>
      )}

      {turnos.length === 0 && participantes.length > 0 && (
        <div style={{ display: "flex", gap: "8px", alignItems: "center", color: tokens.warn, fontSize: "12.5px", marginBottom: "14px" }}>
          <AlertTriangle size={14} /> Define turnos primero para marcar disponibilidad.
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
        {participantesFiltrados.map((p) => {
          const ausente = estaAusenteHoy(p);
          return (
          <div key={p.id} style={{ border: `1px solid ${ausente ? "rgba(217,97,79,0.5)" : tokens.border}`, borderRadius: "10px", background: tokens.surface, padding: "14px" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "10px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                <div className="at-display" style={{ fontSize: "14.5px", fontWeight: 700 }}>{p.nombre}</div>
                {p.genero && (
                  <span className="at-mono" style={{
                    fontSize: "10px", fontWeight: 700, padding: "2px 8px", borderRadius: "20px",
                    color: p.genero === "H" ? tokens.accent2 : "#c98fd6",
                    background: p.genero === "H" ? "rgba(73,179,166,0.12)" : "rgba(201,143,214,0.12)",
                  }}>{p.genero === "H" ? "Hombre" : "Mujer"}</span>
                )}
                {ausente && (
                  <span className="at-mono" style={{ fontSize: "10px", color: tokens.warn, background: "rgba(217,97,79,0.12)", padding: "2px 8px", borderRadius: "20px" }}>Ausente hoy</span>
                )}
              </div>
              <button className="at-btn" onClick={() => removeParticipante(p.id)} style={{ background: "transparent", border: "none", color: tokens.muted, cursor: "pointer" }}>
                <Trash2 size={14} />
              </button>
            </div>

            <div style={{ display: "flex", gap: "8px", alignItems: "center", marginBottom: "12px", flexWrap: "wrap" }}>
              <span style={{ fontSize: "11.5px", color: tokens.muted }}>Género:</span>
              <select className="at-select" value={p.genero || ""} onChange={(e) => updateParticipante(p.id, "genero", e.target.value || null)}>
                <option value="">Sin especificar</option>
                <option value="H">Hombre</option>
                <option value="M">Mujer</option>
              </select>
            </div>

            <div style={{ display: "flex", gap: "8px", alignItems: "center", marginBottom: "12px", flexWrap: "wrap" }}>
              <span style={{ fontSize: "11.5px", color: tokens.muted }}>Preferencia general (se usa si no hay una específica por turno):</span>
              <select className="at-select" value={p.prefPartnerId || ""} onChange={(e) => updateParticipante(p.id, "prefPartnerId", e.target.value || null)}>
                <option value="">Sin preferencia</option>
                {participantes.filter((x) => x.id !== p.id).map((x) => <option key={x.id} value={x.id}>{x.nombre}</option>)}
              </select>
              {p.prefPartnerId && (
                <select className="at-select" value={p.prefTipo} onChange={(e) => updateParticipante(p.id, "prefTipo", e.target.value)}>
                  <option value="blanda">Preferencia (blanda)</option>
                  <option value="dura">Obligatorio (dura)</option>
                </select>
              )}
            </div>

            <div style={{ display: "flex", gap: "8px", alignItems: "center", marginBottom: "12px", flexWrap: "wrap" }}>
              <span style={{ fontSize: "11.5px", color: tokens.muted }}>Máximo de participaciones por mes:</span>
              <select className="at-select" value={p.maxTurnosMes ?? 4} onChange={(e) => updateParticipante(p.id, "maxTurnosMes", parseInt(e.target.value, 10))}>
                {Array.from({ length: 10 }, (_, i) => i + 1).map((n) => (
                  <option key={n} value={n}>{n}</option>
                ))}
              </select>
            </div>

            {turnos.length > 0 && (
              <div style={{ marginBottom: "12px" }}>
                <div style={{ fontSize: "11.5px", color: tokens.muted, marginBottom: "6px" }}>
                  Disponibilidad y preferencia específica por turno
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                  {DIAS.filter((d) => porDia[d]?.length).map((d) => (
                    <div key={d}>
                      <span className="at-mono" style={{ fontSize: "10.5px", color: tokens.muted }}>{d}</span>
                      <div style={{ display: "flex", flexDirection: "column", gap: "4px", marginTop: "3px" }}>
                        {porDia[d].map((t) => {
                          const on = !!p.disponibilidad[t.id];
                          const pref = p.preferenciasPorTurno && p.preferenciasPorTurno[t.id];
                          const fechasEspecificas = (p.fechasPorTurno && p.fechasPorTurno[t.id]) || [];
                          const claveAbierto = `${p.id}:${t.id}`;
                          const abierto = fechasAbiertoPara === claveAbierto;
                          return (
                            <div key={t.id} style={{ display: "flex", flexDirection: "column" }}>
                              <div style={{ display: "flex", gap: "6px", alignItems: "center", flexWrap: "wrap" }}>
                                <div className="at-chip at-mono" onClick={() => toggleDisponibilidad(p.id, t.id)} style={{
                                  fontSize: "10.5px", padding: "4px 8px", borderRadius: "5px",
                                  border: `1px solid ${on ? tokens.accent : tokens.border}`,
                                  background: on ? "rgba(226,166,63,0.15)" : tokens.surfaceAlt,
                                  color: on ? tokens.accent : tokens.muted,
                                }}>
                                  {t.sitio || "Sitio"} {t.inicio}–{t.fin}
                                </div>
                                {on && (
                                  <>
                                    <span style={{ fontSize: "10px", color: tokens.muted }}>con</span>
                                    <select className="at-select" style={{ fontSize: "10.5px", padding: "3px 6px" }}
                                      value={pref?.partnerId || ""}
                                      onChange={(e) => setPreferenciaTurno(p.id, t.id, e.target.value || null, pref?.tipo || "blanda")}>
                                      <option value="">General (sin preferencia específica aquí)</option>
                                      {participantes.filter((x) => x.id !== p.id).map((x) => <option key={x.id} value={x.id}>{x.nombre}</option>)}
                                    </select>
                                    {pref?.partnerId && (
                                      <select className="at-select" style={{ fontSize: "10.5px", padding: "3px 6px" }}
                                        value={pref.tipo}
                                        onChange={(e) => setPreferenciaTurno(p.id, t.id, pref.partnerId, e.target.value)}>
                                        <option value="blanda">Preferencia</option>
                                        <option value="dura">Obligatorio</option>
                                      </select>
                                    )}
                                    <button className="at-btn at-mono" onClick={() => setFechasAbiertoPara(abierto ? null : claveAbierto)} title="Elegir fechas específicas para este turno" style={{
                                      display: "flex", alignItems: "center", gap: "4px",
                                      background: fechasEspecificas.length ? "rgba(226,166,63,0.15)" : "transparent",
                                      border: `1px solid ${fechasEspecificas.length ? tokens.accent : tokens.border}`,
                                      borderRadius: "5px", padding: "3px 7px", fontSize: "10px",
                                      color: fechasEspecificas.length ? tokens.accent : tokens.muted, cursor: "pointer",
                                    }}>
                                      <CalendarClock size={11} /> Fechas{fechasEspecificas.length ? ` (${fechasEspecificas.length})` : ""}
                                    </button>
                                  </>
                                )}
                              </div>
                              {on && abierto && (
                                <SelectorFechasTurno
                                  turnoDia={t.dia}
                                  fechasSeleccionadas={fechasEspecificas}
                                  onChange={(fechas) => setFechasTurno(p.id, t.id, fechas)}
                                  mesInicial={mes}
                                />
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div>
              <div style={{ display: "flex", alignItems: "center", gap: "6px", fontSize: "11.5px", color: tokens.muted, marginBottom: "6px" }}>
                <CalendarX size={12} /> Periodos de ausencia
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
                {(p.ausencias || []).map((a, idx) => (
                  <div key={idx} style={{ display: "flex", gap: "6px", alignItems: "center", flexWrap: "wrap" }}>
                    <span className="at-mono" style={{ fontSize: "10.5px", color: tokens.muted }}>Desde</span>
                    <input className="at-input at-mono" type="date" value={a.desde} onChange={(e) => updateAusencia(p.id, idx, "desde", e.target.value)} style={{ padding: "5px 8px", fontSize: "12px" }} />
                    <span className="at-mono" style={{ fontSize: "10.5px", color: tokens.muted }}>Hasta</span>
                    <input className="at-input at-mono" type="date" value={a.hasta} onChange={(e) => updateAusencia(p.id, idx, "hasta", e.target.value)} style={{ padding: "5px 8px", fontSize: "12px" }} />
                    <button className="at-btn" onClick={() => removeAusencia(p.id, idx)} style={{ background: tokens.surfaceAlt, border: `1px solid ${tokens.border}`, borderRadius: "6px", color: tokens.warn, width: "28px", height: "28px", display: "flex", alignItems: "center", justifyContent: "center" }}>
                      <Trash2 size={12} />
                    </button>
                  </div>
                ))}
              </div>
              <button className="at-btn" onClick={() => addAusencia(p.id)} style={{ marginTop: "8px", display: "flex", alignItems: "center", gap: "6px", background: "transparent", border: `1px dashed ${tokens.border}`, borderRadius: "6px", padding: "6px 10px", color: tokens.muted, fontSize: "11.5px" }}>
                <Plus size={12} /> Añadir periodo de ausencia
              </button>
            </div>
          </div>
          );
        })}
      </div>
    </div>
  );
}

function formatFechaLarga(fecha, dia) {
  if (!fecha) return "";
  const [y, m, d] = fecha.split("-");
  return `${dia} ${d}/${m}/${y}`;
}

// Pequeño formulario para fijar a mano la pareja de un turno concreto. Se usa dentro de
// AsignacionTab, tanto para crear una asignación manual nueva como para editar/quitar una existente.
function EditorAsignacionManual({ participantes, pairInicial, onGuardar, onQuitar, onCancelar }) {
  const [id1, setId1] = useState(pairInicial?.[0] || "");
  const [id2, setId2] = useState(pairInicial?.[1] || "");
  const valido = id1 && id2 && id1 !== id2;

  return (
    <div style={{
      display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap",
      padding: "10px", borderRadius: "6px", background: tokens.surfaceAlt, border: `1px solid ${tokens.border}`,
    }}>
      <select className="at-select" style={{ fontSize: "11.5px" }} value={id1} onChange={(e) => setId1(e.target.value)}>
        <option value="">Persona 1</option>
        {participantes.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
      </select>
      <Link2 size={13} color={tokens.muted} />
      <select className="at-select" style={{ fontSize: "11.5px" }} value={id2} onChange={(e) => setId2(e.target.value)}>
        <option value="">Persona 2</option>
        {participantes.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
      </select>
      <button className="at-btn" onClick={() => valido && onGuardar([id1, id2])} disabled={!valido} style={{
        background: valido ? tokens.accent : tokens.border, border: "none", borderRadius: "6px",
        padding: "6px 12px", color: valido ? "#1a1206" : tokens.muted, fontSize: "11.5px", fontWeight: 700,
        cursor: valido ? "pointer" : "not-allowed",
      }}>
        Guardar
      </button>
      {onQuitar && (
        <button className="at-btn" onClick={onQuitar} style={{ background: "transparent", border: "none", color: tokens.warn, fontSize: "11.5px", cursor: "pointer", textDecoration: "underline", padding: 0 }}>
          Quitar asignación manual
        </button>
      )}
      <button className="at-btn" onClick={onCancelar} style={{ background: "transparent", border: "none", color: tokens.muted, fontSize: "11.5px", cursor: "pointer", padding: 0, marginLeft: "auto" }}>
        Cancelar
      </button>
      {id1 && id2 && id1 === id2 && (
        <div style={{ width: "100%", fontSize: "10.5px", color: tokens.warn }}>Elige dos personas distintas.</div>
      )}
    </div>
  );
}

function AsignacionTab({ plantillas, participantes, mes, setMes, turnosDelMes, generarMes, asignacion, generar, nombreDe, cubiertos, asignacionManual, setManual }) {
  const puedeGenerarMes = plantillas.length > 0 && !!mes;
  const puedeAsignar = turnosDelMes.length > 0 && participantes.length >= 2;
  const [editandoId, setEditandoId] = useState(null); // id del turno cuyo editor manual está abierto

  const porFecha = useMemo(() => {
    const map = {};
    turnosDelMes.forEach((t) => {
      if (!map[t.fecha]) map[t.fecha] = [];
      map[t.fecha].push(t);
    });
    return map;
  }, [turnosDelMes]);
  const fechasOrdenadas = Object.keys(porFecha).sort();

  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-end", gap: "10px", marginBottom: "10px", flexWrap: "wrap" }}>
        <div>
          <div style={{ fontSize: "11px", color: tokens.muted, marginBottom: "4px" }}>Mes a programar</div>
          <input className="at-input at-mono" type="month" value={mes} onChange={(e) => setMes(e.target.value)} />
        </div>
        <button className="at-btn" onClick={generarMes} disabled={!puedeGenerarMes} style={{
          display: "flex", alignItems: "center", gap: "6px",
          background: puedeGenerarMes ? tokens.accent2 : tokens.surfaceAlt, border: "none", borderRadius: "8px",
          padding: "9px 16px", color: puedeGenerarMes ? "#04211d" : tokens.muted, fontSize: "13px", fontWeight: 700,
          cursor: puedeGenerarMes ? "pointer" : "not-allowed",
        }}>
          <CalendarClock size={14} /> Generar turnos de este mes
        </button>
        <div style={{ fontSize: "11.5px", color: tokens.muted, paddingBottom: "9px" }}>
          {turnosDelMes.length > 0 ? `${turnosDelMes.length} turnos generados` : "Aún no has generado los turnos de este mes"}
        </div>
      </div>

      {plantillas.length === 0 && (
        <div style={{ display: "flex", gap: "8px", alignItems: "center", color: tokens.warn, fontSize: "12.5px", margin: "10px 0" }}>
          <AlertTriangle size={14} /> Primero define al menos una plantilla de turno recurrente en la pestaña Plantillas.
        </div>
      )}

      <div style={{ height: "1px", background: tokens.border, margin: "16px 0 18px" }} />

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "10px" }}>
        <div style={{ fontSize: "12.5px", color: tokens.muted }}>
          {turnosDelMes.length > 0
            ? `${cubiertos} de ${turnosDelMes.length} turnos cubiertos`
            : "Genera la asignación con los turnos del mes."}
        </div>
        <button className="at-btn" onClick={generar} disabled={!puedeAsignar} style={{
          display: "flex", alignItems: "center", gap: "6px",
          background: puedeAsignar ? tokens.accent : tokens.surfaceAlt, border: "none", borderRadius: "8px",
          padding: "9px 16px", color: puedeAsignar ? "#1a1206" : tokens.muted, fontSize: "13px", fontWeight: 700,
          cursor: puedeAsignar ? "pointer" : "not-allowed",
        }}>
          <Shuffle size={14} /> Generar asignación
        </button>
      </div>

      {!puedeAsignar && (
        <div style={{ color: tokens.muted, fontSize: "13px" }}>Necesitas turnos generados para este mes y al menos dos participantes con disponibilidad cargada.</div>
      )}

      <div style={{ color: tokens.muted, fontSize: "11.5px", marginBottom: "14px", lineHeight: 1.5 }}>
        Nota: si alguien tiene un periodo de ausencia que cubre la fecha exacta de un turno, no se le asigna ese turno.
        El sistema también intenta repartir las participaciones de cada persona de forma pareja a lo largo del mes
        (por ejemplo, si su máximo es 2, procura separarlas ~15 días; si es 4, procura una por semana).
        También puedes fijar la pareja de un turno a mano con "Asignar manualmente": esa pareja queda protegida
        y "Generar asignación" solo completa automáticamente el resto de turnos alrededor de ella.
      </div>

      {fechasOrdenadas.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: "18px" }}>
          {fechasOrdenadas.map((fecha) => (
            <div key={fecha}>
              <div className="at-mono" style={{ fontSize: "11px", color: tokens.muted, marginBottom: "8px", letterSpacing: "0.05em" }}>
                {formatFechaLarga(fecha, porFecha[fecha][0].dia).toUpperCase()}
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                {porFecha[fecha].map((t) => {
                  const r = asignacion ? asignacion.resultados[t.id] : null;
                  const pairManual = asignacionManual[t.id] || null;
                  const pairEfectivo = pairManual || r?.pair || null;
                  const esManual = !!pairManual;
                  const editando = editandoId === t.id;
                  return (
                    <div key={t.id} style={{
                      display: "flex", flexDirection: "column", gap: "8px", padding: "10px 14px", borderRadius: "8px",
                      border: `1px solid ${pairEfectivo ? (esManual ? tokens.accent : tokens.border) : asignacion ? "rgba(217,97,79,0.4)" : tokens.border}`,
                      background: pairEfectivo ? tokens.surface : asignacion ? "rgba(217,97,79,0.06)" : tokens.surface,
                    }}>
                      <div style={{ display: "flex", alignItems: "center", gap: "12px", flexWrap: "wrap" }}>
                        <div className="at-mono" style={{ fontSize: "11px", color: tokens.accent2, background: tokens.surfaceAlt, padding: "4px 8px", borderRadius: "5px", whiteSpace: "nowrap" }}>
                          {t.sitio || "Sitio"} · {t.inicio}–{t.fin}
                        </div>
                        <ChevronRight size={13} color={tokens.muted} />
                        {!pairEfectivo ? (
                          asignacion ? (
                            <div style={{ display: "flex", alignItems: "center", gap: "6px", color: tokens.warn, fontSize: "12.5px" }}>
                              <AlertTriangle size={13} />{r?.reason || "Sin asignar"}
                            </div>
                          ) : (
                            <span style={{ fontSize: "12.5px", color: tokens.muted }}>Sin asignar todavía</span>
                          )
                        ) : (
                          <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                            <span style={{ fontSize: "13.5px", fontWeight: 600 }}>{nombreDe(pairEfectivo[0])}</span>
                            <Link2 size={13} color={tokens.accent} />
                            <span style={{ fontSize: "13.5px", fontWeight: 600 }}>{nombreDe(pairEfectivo[1])}</span>
                            {esManual && (
                              <span className="at-mono" style={{ fontSize: "9.5px", fontWeight: 700, color: tokens.accent, background: "rgba(226,166,63,0.15)", padding: "2px 7px", borderRadius: "20px" }}>
                                MANUAL
                              </span>
                            )}
                          </div>
                        )}
                        <button className="at-btn at-mono" onClick={() => setEditandoId(editando ? null : t.id)} style={{
                          marginLeft: "auto", display: "flex", alignItems: "center", gap: "4px",
                          background: "transparent", border: `1px solid ${tokens.border}`, borderRadius: "5px",
                          padding: "4px 8px", fontSize: "10.5px", color: tokens.muted, cursor: "pointer", whiteSpace: "nowrap",
                        }}>
                          {esManual ? "Editar manual" : "Asignar manualmente"}
                        </button>
                      </div>
                      {editando && (
                        <EditorAsignacionManual
                          participantes={participantes}
                          pairInicial={pairManual}
                          onGuardar={(pair) => { setManual(t.id, pair); setEditandoId(null); }}
                          onQuitar={esManual ? () => { setManual(t.id, null); setEditandoId(null); } : null}
                          onCancelar={() => setEditandoId(null)}
                        />
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function construirCeldas(mesStr) {
  if (!mesStr) return [];
  const [yearStr, monthStr] = mesStr.split("-");
  const year = parseInt(yearStr, 10);
  const month = parseInt(monthStr, 10) - 1;
  if (Number.isNaN(year) || Number.isNaN(month)) return [];
  const diasEnMes = new Date(year, month + 1, 0).getDate();
  const primerDiaSemana = (new Date(year, month, 1).getDay() + 6) % 7; // 0 = Lunes
  const celdas = [];
  for (let i = 0; i < primerDiaSemana; i++) celdas.push(null);
  for (let d = 1; d <= diasEnMes; d++) {
    const fecha = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    celdas.push({ fecha, dia: d });
  }
  while (celdas.length % 7 !== 0) celdas.push(null);
  return celdas;
}

// Construye y descarga un archivo .xlsx con el mismo aspecto que la pestaña Calendario de la app:
// una cuadrícula de semanas (filas) x días (columnas), con el número de cada día y, debajo, los turnos
// de esa fecha coloreados según su estado (verde = asignado, rojo = sin asignar, gris = pendiente).
async function exportarCalendarioExcel(mes, turnosDelMes, asignacion, nombreDe, asignacionManual = {}) {
  if (!window.ExcelJS) {
    alert("No se pudo cargar el motor de Excel (revisa tu conexión a internet) e inténtalo de nuevo.");
    return;
  }

  const COLOR_FONDO = "FFFFFFFF";
  const COLOR_CABECERA = "FFEEF1F5";
  const COLOR_TITULO = "FFF4F5F7";
  const COLOR_BORDE = "FFD7DCE3";
  const COLOR_TEXTO = "FF1B2027";
  const COLOR_MUTED = "FF5B6472";
  const COLOR_ACCENT = "FFB3791E";
  const COLOR_OK = "FF1F8F80";
  const COLOR_WARN = "FFC94A39";

  const turnosPorFecha = {};
  turnosDelMes.forEach((t) => {
    if (!turnosPorFecha[t.fecha]) turnosPorFecha[t.fecha] = [];
    turnosPorFecha[t.fecha].push(t);
  });
  Object.values(turnosPorFecha).forEach((arr) => arr.sort((a, b) => a.inicio.localeCompare(b.inicio)));

  const celdas = construirCeldas(mes);
  const hoy = new Date().toISOString().slice(0, 10);

  const wb = new window.ExcelJS.Workbook();
  wb.creator = "Asignador de turnos";
  const nombreHoja = (formatMesLargo(mes) || "Calendario").slice(0, 31);
  const ws = wb.addWorksheet(nombreHoja, { views: [{ showGridLines: false }] });
  ws.columns = DIAS.map(() => ({ width: 24 }));

  // Fila 1: título del mes
  ws.mergeCells(1, 1, 1, 7);
  const titulo = ws.getCell(1, 1);
  titulo.value = `Calendario de turnos — ${formatMesLargo(mes)}`;
  titulo.font = { bold: true, size: 14, color: { argb: COLOR_TEXTO }, name: "Calibri" };
  titulo.alignment = { horizontal: "center", vertical: "middle" };
  titulo.fill = { type: "pattern", pattern: "solid", fgColor: { argb: COLOR_TITULO } };
  ws.getRow(1).height = 28;

  // Fila 2: cabecera con los días de la semana
  const filaCabecera = ws.getRow(2);
  DIAS.forEach((d, i) => {
    const c = filaCabecera.getCell(i + 1);
    c.value = d;
    c.font = { bold: true, size: 10, color: { argb: COLOR_MUTED }, name: "Calibri" };
    c.alignment = { horizontal: "center", vertical: "middle" };
    c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: COLOR_CABECERA } };
  });
  filaCabecera.height = 18;

  const bordeFino = { style: "thin", color: { argb: COLOR_BORDE } };
  const semanas = [];
  for (let i = 0; i < celdas.length; i += 7) semanas.push(celdas.slice(i, i + 7));

  let filaActual = 3;
  semanas.forEach((semana) => {
    const fila = ws.getRow(filaActual);
    let maxLineas = 2;
    semana.forEach((c, colIdx) => {
      const celda = fila.getCell(colIdx + 1);
      celda.alignment = { vertical: "top", horizontal: "left", wrapText: true };
      celda.border = { top: bordeFino, left: bordeFino, bottom: bordeFino, right: bordeFino };
      celda.fill = { type: "pattern", pattern: "solid", fgColor: { argb: COLOR_FONDO } };
      if (!c) return;

      const esHoy = c.fecha === hoy;
      const runs = [{ text: `${c.dia}\n`, font: { bold: true, size: 10, name: "Calibri", color: { argb: esHoy ? COLOR_ACCENT : COLOR_TEXTO } } }];
      const turnosDia = turnosPorFecha[c.fecha] || [];
      turnosDia.forEach((t) => {
        const r = asignacion ? asignacion.resultados[t.id] : null;
        const pairManual = asignacionManual[t.id] || null;
        const pair = pairManual || r?.pair || null;
        const encabezado = `${t.inicio} · ${t.sitio || "Sitio"}`;
        const detalle = pair
          ? `${nombreDe(pair[0])} · ${nombreDe(pair[1])}${pairManual ? " (manual)" : ""}`
          : asignacion ? (r?.reason || "Sin asignar") : "Pendiente de asignar";
        const color = pair ? COLOR_OK : asignacion ? COLOR_WARN : COLOR_MUTED;
        runs.push({ text: `${encabezado}\n`, font: { bold: true, size: 9, name: "Calibri", color: { argb: COLOR_TEXTO } } });
        runs.push({ text: `${detalle}\n`, font: { size: 9, name: "Calibri", color: { argb: color } } });
      });
      celda.value = { richText: runs };
      maxLineas = Math.max(maxLineas, 1 + turnosDia.length * 2);
    });
    fila.height = Math.max(18, maxLineas * 13);
    filaActual++;
  });

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `turnos-calendario-${mes || "mes"}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function CalendarioTab({ mes, setMes, turnosDelMes, asignacion, nombreDe, historial, asignacionManual = {} }) {
  const [exportando, setExportando] = useState(false);
  const turnosPorFecha = useMemo(() => {
    const map = {};
    turnosDelMes.forEach((t) => {
      if (!map[t.fecha]) map[t.fecha] = [];
      map[t.fecha].push(t);
    });
    Object.values(map).forEach((arr) => arr.sort((a, b) => a.inicio.localeCompare(b.inicio)));
    return map;
  }, [turnosDelMes]);

  const celdas = useMemo(() => construirCeldas(mes), [mes]);
  const hoy = new Date().toISOString().slice(0, 10);
  const mesesConDatos = Object.keys(historial).filter((m) => historial[m]?.turnosDelMes?.length).sort();

  const manejarExportar = async () => {
    setExportando(true);
    try {
      await exportarCalendarioExcel(mes, turnosDelMes, asignacion, nombreDe, asignacionManual);
    } catch (e) {
      alert("No se pudo generar el Excel. Inténtalo de nuevo.");
    } finally {
      setExportando(false);
    }
  };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "16px", flexWrap: "wrap", gap: "10px" }}>
        <div>
          <div className="at-display" style={{ fontSize: "16px", fontWeight: 700, textTransform: "capitalize" }}>{formatMesLargo(mes)}</div>
          <div style={{ fontSize: "11.5px", color: tokens.muted, marginTop: "2px" }}>
            {asignacion ? "Asignación grabada para este mes" : turnosDelMes.length > 0 ? "Turnos generados, falta asignar" : "Sin turnos generados para este mes"}
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
          <button className="at-btn" onClick={manejarExportar} disabled={turnosDelMes.length === 0 || exportando} title="Exportar a Excel en vista calendario" style={{
            display: "flex", alignItems: "center", gap: "6px",
            background: turnosDelMes.length ? tokens.accent2 : tokens.surfaceAlt, border: "none", borderRadius: "8px",
            padding: "9px 14px", color: turnosDelMes.length ? "#04211d" : tokens.muted, fontSize: "13px", fontWeight: 700,
            cursor: turnosDelMes.length && !exportando ? "pointer" : "not-allowed",
          }}>
            <Download size={14} /> {exportando ? "Generando…" : "Exportar a Excel"}
          </button>
          <input className="at-input at-mono" type="month" value={mes} onChange={(e) => setMes(e.target.value)} />
        </div>
      </div>
        <div style={{ display: "flex", gap: "6px", flexWrap: "wrap", marginBottom: "16px" }}>
          {mesesConDatos.map((m) => (
            <div key={m} className="at-chip at-mono" onClick={() => setMes(m)} style={{
              fontSize: "10.5px", padding: "4px 9px", borderRadius: "20px",
              border: `1px solid ${m === mes ? tokens.accent : tokens.border}`,
              background: m === mes ? "rgba(226,166,63,0.15)" : tokens.surfaceAlt,
              color: m === mes ? tokens.accent : tokens.muted,
            }}>
              {formatMesLargo(m)}{historial[m]?.asignacion ? " ✓" : ""}
            </div>
          ))}
        </div>

      {turnosDelMes.length === 0 ? (
        <div style={{ color: tokens.muted, fontSize: "13px" }}>
          Ve a la pestaña Asignación, elige este mes y genera los turnos para poder verlos aquí.
        </div>
      ) : (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: "5px", marginBottom: "6px" }}>
            {DIAS.map((d) => (
              <div key={d} className="at-mono" style={{ fontSize: "10px", color: tokens.muted, textAlign: "center", padding: "2px 0" }}>{d}</div>
            ))}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: "5px" }}>
            {celdas.map((c, i) => {
              if (!c) return <div key={i} />;
              const turnosDia = turnosPorFecha[c.fecha] || [];
              const esHoy = c.fecha === hoy;
              return (
                <div key={i} style={{
                  minHeight: "72px", border: `1px solid ${esHoy ? tokens.accent : tokens.border}`, borderRadius: "6px",
                  background: tokens.surface, padding: "4px 5px", display: "flex", flexDirection: "column", gap: "3px",
                }}>
                  <div className="at-mono" style={{ fontSize: "10px", color: esHoy ? tokens.accent : tokens.muted }}>{c.dia}</div>
                  {turnosDia.map((t) => {
                    const r = asignacion ? asignacion.resultados[t.id] : null;
                    const pairManual = asignacionManual[t.id] || null;
                    const pair = pairManual || r?.pair || null;
                    return (
                      <div key={t.id} title={`${t.sitio} ${t.inicio}–${t.fin}`} style={{
                        fontSize: "8.5px", lineHeight: 1.35, borderRadius: "4px", padding: "2px 4px",
                        background: pair ? (pairManual ? "rgba(226,166,63,0.16)" : "rgba(73,179,166,0.14)") : asignacion ? "rgba(217,97,79,0.14)" : tokens.surfaceAlt,
                        color: pair ? (pairManual ? tokens.accent : tokens.accent2) : asignacion ? tokens.warn : tokens.muted,
                      }}>
                        <div className="at-mono" style={{ fontWeight: 600 }}>{t.inicio} · {t.sitio}</div>
                        {pair ? (
                          <div style={{ color: tokens.text }}>{nombreDe(pair[0])} · {nombreDe(pair[1])}{pairManual ? " ✎" : ""}</div>
                        ) : asignacion ? (
                          <div>Sin asignar</div>
                        ) : null}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AsignadorTurnos />);
</script>
